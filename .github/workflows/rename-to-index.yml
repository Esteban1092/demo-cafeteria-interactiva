name: Rename demo file to index.html
on:
  workflow_dispatch:
jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename uploaded file to index.html
        run: |
          git mv -f demo-cafeteria-interactiva-haru-wobble.html index.html
          git config user.name "Esteban1092"
          git config user.email "Esteban1092@users.noreply.github.com"
          git commit -m "Rename demo file to index.html"
          git push
