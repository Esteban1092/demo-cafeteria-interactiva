name: Rename demo file to index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename demo file to index.html
        run: |
          git config user.name "Esteban1092"
          git config user.email "Esteban1092@users.noreply.github.com"
          git mv demo-cafeteria-interactiva-final.html index.html
          git commit -m "Rename demo file to index.html"
          git push
